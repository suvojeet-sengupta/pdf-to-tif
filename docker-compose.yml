services:
  pdf-to-tif:
    build: .
    image: pdf-to-tif:latest
    container_name: pdf-to-tif
    restart: unless-stopped
    # Copy .env.example to .env and set APP_PASSWORD + SESSION_SECRET first.
    env_file:
      - .env
    ports:
      # Bind to localhost only - cloudflared reaches it from the host.
      # Change to "9000:9000" if you want it exposed on the LAN.
      - "127.0.0.1:9000:9000"
    environment:
      PORT: 9000
      DATA_DIR: /data
    volumes:
      - pdf2tif-data:/data
    tmpfs:
      # Small on purpose - uploads are spooled onto the data volume instead.
      - /tmp:size=64m
    # Rendering large pages is memory hungry; cap it so one PDF cannot
    # take the whole VPS down. Raise if you convert huge documents.
    deploy:
      resources:
        limits:
          memory: 3g

volumes:
  pdf2tif-data:
